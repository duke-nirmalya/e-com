<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVAÉ — Shop</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Shop CSS -->
    <link rel="stylesheet" href="shop2.css">
</head>

<body>

   <!-- =====================================================
     SHOP SECTION
===================================================== -->

<section id="shop" class="section shop-section">


<div class="container-fluid px-lg-5">

    <!-- Shop Heading -->
    <div class="section-top shop-heading">

        <div>

            <span class="section-label">
                SHOP
            </span>

            <h2>
                Latest
                <em>drops.</em>
            </h2>

        </div>


        <!-- Shop Tools -->
        <div class="shop-tools">

            <!-- Category Filters -->
            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-category="all"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-category="women"
                >
                    Women
                </button>

                <button
                    class="filter-btn"
                    data-category="men"
                >
                    Men
                </button>

                <button
                    class="filter-btn"
                    data-category="accessories"
                >
                    Accessories
                </button>

            </div>


            <!-- Sort -->
            <select
                id="sortSelect"
                class="sort-select"
            >

                <option value="featured">
                    Featured
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

                <option value="rating">
                    Highest Rated
                </option>

            </select>

        </div>

    </div>


    <!-- Product Grid -->
    <div
        class="row g-4"
        id="productGrid"
    ></div>

</div>


</section>

<!-- =====================================================
     PRODUCT QUICK VIEW MODAL
===================================================== -->

<div
    class="modal fade"
    id="productModal"
    tabindex="-1"
>


<div
    class="modal-dialog modal-xl modal-dialog-centered"
>

    <div class="modal-content product-modal">

        <!-- Close Button -->
        <button
            type="button"
            class="modal-close"
            data-bs-dismiss="modal"
        >
            <i class="bi bi-x-lg"></i>
        </button>


        <!-- Product Details -->
        <div
            class="row g-0"
            id="modalProduct"
        ></div>

    </div>

</div>


</div>

    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Shop JS -->

    <script src="shop2.js"></script>

</body>

</html>
