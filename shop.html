<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVAÉ — Shop</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Google Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
        rel="stylesheet"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >


    <!-- Shop CSS -->

    <link
        rel="stylesheet"
        href="assets/css/shop.css"
    >

</head>


<body>


<!-- Header -->

<div id="site-header"></div>


<!-- Shop Hero -->

<section class="shop-hero">

    <div class="shop-hero-content">

        <span class="section-label">
            NOVAÉ / SHOP
        </span>

        <h1>
            The <em>collection.</em>
        </h1>

        <p>
            Discover contemporary pieces designed
            for everyday expression.
        </p>

    </div>

</section>


<!-- Shop -->

<section class="shop-section">

    <div class="container-fluid px-lg-5">


        <!-- Shop Top -->

        <div class="shop-top">

            <div>

                <span class="section-label">
                    SHOP ALL
                </span>

                <h2>
                    Discover <em>more.</em>
                </h2>

            </div>


            <!-- Sort -->

            <select id="sortSelect">

                <option value="featured">
                    Featured
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

            </select>

        </div>


        <!-- Filters -->

        <div class="shop-filters">

            <button
                class="filter-btn active"
                data-category="all">
                ALL
            </button>

            <button
                class="filter-btn"
                data-category="women">
                WOMEN
            </button>

            <button
                class="filter-btn"
                data-category="men">
                MEN
            </button>

            <button
                class="filter-btn"
                data-category="accessories">
                ACCESSORIES
            </button>

        </div>


        <!-- Search -->

        <div class="shop-search">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >

        </div>


        <!-- Product Count -->

        <div class="product-count">

            <span id="productCount">
                0
            </span>

            PRODUCTS

        </div>


        <!-- Products -->

        <div
            id="productGrid"
            class="product-grid">
        </div>


        <!-- Empty Message -->

        <div
            id="emptyMessage"
            class="empty-message">

            <i class="bi bi-search"></i>

            <h3>
                No products found
            </h3>

            <p>
                Try another search or category.
            </p>

        </div>

    </div>

</section>


<!-- Footer -->

<div id="site-footer"></div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Common JS -->

<script src="assets/js/common/storage.js"></script>

<script src="assets/js/common/api.js"></script>

<script src="assets/js/common/ui.js"></script>


<!-- Cart -->

<script src="assets/js/cart.js"></script>


<!-- Shop -->

<script src="assets/js/shop.js"></script>


<script>

    initLayout().then(() => {

        initCartWidget();

        initShopPage();

    });

</script>


</body>

</html>
