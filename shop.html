<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — NOVAÉ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Owner: Student B (Shop / Product listing + filtering + search + quick view) -->

<div id="site-header"></div>

<section class="section shop-section" style="padding-top:140px;">
    <div class="container-fluid px-lg-5">

        <div class="section-top shop-heading">
            <div>
                <span class="section-label">SHOP</span>
                <h2>Latest <em>drops.</em></h2>
            </div>

            <div class="shop-tools">
                <div class="filter-buttons" id="filterButtons">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="women">Women</button>
                    <button class="filter-btn" data-category="men">Men</button>
                    <button class="filter-btn" data-category="accessories">Accessories</button>
                </div>

                <select id="sortSelect" class="sort-select">
                    <option value="featured">Featured</option>
                    <option value="low">Price: Low to High</option>
                    <option value="high">Price: High to Low</option>
                    <option value="rating">Highest Rated</option>
                </select>
            </div>
        </div>

        <!--
            TODO(you — Student B): while products are loading,
            show a loading state here (e.g. skeleton cards or a
            spinner) instead of an empty grid — this is where
            "asynchronous" becomes visible to the user.
        -->
        <div class="row g-4" id="productGrid"></div>

    </div>
</section>

<div id="site-footer"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/common/storage.js"></script>
<script src="assets/js/common/api.js"></script>
<script src="assets/js/common/ui.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/shop.js"></script>

<script>
    initLayout().then(() => {
        initCartWidget();
        initShopPage();
    });
</script>

</body>
</html>
